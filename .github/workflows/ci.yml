name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests experiments
      - run: ruff format --check src tests experiments
      - run: pytest -q
      - name: Historical re-analysis reproduces the committed report
        run: |
          python experiments/reanalyze_history.py > /dev/null
          git diff --exit-code results/history/REPORT.md
