[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "musicplag"
version = "0.4.0"
description = "Interpretable music-plagiarism analysis: CQT, chroma, DTW, joint NMF, Markov chains, SSM and Fourier-Mellin invariants, with an honest evaluation record."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Maksym Sokolnytskyi" }]
dependencies = ["numpy>=1.26", "scipy>=1.11", "pydantic>=2.6"]

[project.optional-dependencies]
audio = ["librosa>=0.10", "soundfile>=0.12"]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.5", "scikit-learn>=1.4"]

[project.scripts]
musicplag = "musicplag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/musicplag"]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
